[pytest]
# RadarSuite v3.5.0 - Point 12: Unit Testing Configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Coverage options (requires pytest-cov)
# Run with: pytest --cov=. --cov-report=html --cov-report=term
# Target: >80% coverage

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires dependencies)
    slow: Slow tests
    gpu: Tests requiring GPU
    audio: Tests requiring audio devices

# Logging
log_cli = false
log_cli_level = INFO
